<!doctype html>
<html lang="en" data-motion="off">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04060d" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="VelocityX — liquid-glass dashboard for the SUPER INDIBOT Binance USD-M futures bot: stable realtime metrics, MTF trend engine, screener and risk ladder telemetry."
    />
    <title>VelocityX — Liquid Glass Trading Desk</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%233ef0ff'/><stop offset='1' stop-color='%23a874ff'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='%23060a14'/><path d='M6 8l10 18L26 8' fill='none' stroke='url(%23g)' stroke-width='4' stroke-linecap='round'/></svg>"
    />
    <style>
      /* Pre-paint shell: kills the white flash and restores the saved motion
         preference before React boots. */
      html,
      body {
        margin: 0;
        background: #04060d;
        color: #eef3ff;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(60% 40% at 20% 20%, rgba(62, 240, 255, 0.16), transparent 60%),
          radial-gradient(55% 45% at 80% 30%, rgba(168, 116, 255, 0.18), transparent 62%), #04060d;
        font: 600 12px/1.6 'Inter', 'Segoe UI', system-ui, sans-serif;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #8c97b7;
        z-index: 1;
      }
      #boot .pulse {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 8px;
        border-radius: 50%;
        background: #3ef0ff;
        box-shadow: 0 0 12px #3ef0ff;
        opacity: 0.85;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .pulse {
          animation: none;
        }
      }
    </style>
    <script>
      try {
        var m = localStorage.getItem('vx.motion.v2');
        document.documentElement.dataset.motion = m === 'true' ? 'on' : 'off';
      } catch (e) {
        /* private mode */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><span><span class="pulse"></span>VelocityX · liquid desk booting</span></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
